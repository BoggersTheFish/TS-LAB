[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-lab"
version = "0.1.0"
description = "Constitutional and machine-readable contracts for TS-LAB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema[format-nongpl]>=4.23,<5",
  "PyYAML>=6.0.2,<7",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
