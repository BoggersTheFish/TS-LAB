id: assumption:fixture.abstract-comparison-premise
schema_version: "0.1.0"
statement: The fixture labels its comparison relation without asserting an unrecorded numerical magnitude.
scope:
  domain: DEC24-C schema reference case
  boundaries:
    - Applies only to qualitative fixture comparison records.
  exclusions:
    - Empirical magnitude.
    - General physical interpretation.
applicability:
